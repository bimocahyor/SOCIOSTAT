/* ── Inline the math from StudentTCalc ── */
function _betaCf(a,b,x){const MAXIT=200,EPS=3e-14,FPMIN=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<=EPS)break;}return h;}
function _lnGamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++)ser+=c[j]/++y;return -tmp+Math.log(2.5066282746310005*ser/x);}
function _ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const lbeta=_lnGamma(a)+_lnGamma(b)-_lnGamma(a+b);const front=Math.exp(Math.log(x)*a+Math.log(1-x)*b-lbeta)/a;if(x<(a+1)/(a+b+2))return front*_betaCf(a,b,x);return 1-Math.exp(Math.log(1-x)*b+Math.log(x)*a-lbeta)/b*_betaCf(b,a,1-x);}
function tCdf(t,df){const x=df/(df+t*t);const ibx=_ibeta(x,df/2,0.5);return t<0?ibx/2:1-ibx/2;}
function tPpf(p,df){if(p<=0)return -Infinity;if(p>=1)return Infinity;if(Math.abs(p-0.5)<1e-12)return 0;let lo=-1000,hi=1000;while(tCdf(lo,df)>p)lo*=2;while(tCdf(hi,df)<p)hi*=2;for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(tCdf(mid,df)<p)lo=mid;else hi=mid;if(hi-lo<1e-10)break;}return(lo+hi)/2;}

const T_TABLE={

  15:{0.25:0.691,0.10:1.341,0.05:1.753,0.025:2.131,0.01:2.602},
  16:{0.25:0.690,0.10:1.337,0.05:1.746,0.025:2.120,0.01:2.583},

const out = document.getElementById('out');
function log(msg, cls) {
  const s = document.createElement('span');
  s.className = cls || '';
  s.textContent = msg + '\n';
  out.appendChild(s);
}

log('=== GOLDEN TESTS (fallback math, no jStat) ===', 'head');

function goldenTest(name, got, expected, tol) {
  const pass = Math.abs(got - expected) <= tol;
  log(`${pass?'PASS':'FAIL'} ${name}: got ${got.toFixed(6)}, expect ${expected} (±${tol})`, pass?'pass':'fail');
  return pass;
}

let allGold = true;
allGold &= goldenTest('T1: df=1 one-tailed α=.05', tPpf(0.95,1), 6.314, 0.01);
allGold &= goldenTest('T2: df=10 one-tailed α=.05', tPpf(0.95,10), 1.812, 0.01);
allGold &= goldenTest('T3: df=10 two-tailed α=.05 (table α=.025)', tPpf(0.975,10), 2.228, 0.01);
allGold &= goldenTest('T4: df=10 one-tailed α=.01', tPpf(0.99,10), 2.764, 0.01);
allGold &= goldenTest('T5: df=10 two-tailed α=.02 (table α=.01)', tPpf(0.99,10), 2.764, 0.01);

// Test 6: p-value
const p6 = 2 * Math.min(tCdf(2.228,10), 1-tCdf(2.228,10));
allGold &= goldenTest('T6: p-value df=10 t=2.228 two-tailed', p6, 0.05, 0.005);

// Test 7: t=0 → P=0.5
const p7 = tCdf(0,10);
allGold &= goldenTest('T7: P(T≤0) df=10', p7, 0.5, 1e-6);

// Test 8: t=-2.228 two-tailed p≈.05
const p8 = 2 * Math.min(tCdf(-2.228,10), 1-tCdf(-2.228,10));
allGold &= goldenTest('T8: p-value df=10 t=-2.228 two-tailed', p8, 0.05, 0.005);

// Additional: left tail df=10 α=.05 → -1.812
allGold &= goldenTest('T9: df=10 left-tailed α=.05', tPpf(0.05,10), -1.812, 0.01);

log(allGold ? '\n✓ ALL GOLDEN TESTS PASS' : '\n✗ SOME GOLDEN TESTS FAILED', allGold?'pass':'fail');

log('\n=== REFERENCE TABLE COMPARISON (tolerance = 0.005) ===', 'head');
const ALPHAS=[0.25,0.10,0.05,0.025,0.01];
let refPass=0, refFail=0;
Object.keys(T_TABLE).forEach(dfStr=>{
  const df=parseInt(dfStr);
  const row=T_TABLE[dfStr];
  ALPHAS.forEach(alpha=>{
    const tv=row[alpha];
    const exact=tPpf(1-alpha,df);
    const diff=Math.abs(exact-tv);
    const pass=diff<=0.005;
    if(pass){refPass++;}
    else{refFail++;log(`FAIL df=${df} α=${alpha}: table=${tv} exact=${exact.toFixed(4)} diff=${diff.toFixed(4)}`,'fail');}
  });
});
log(`\nReference table: ${refPass} PASS, ${refFail} FAIL`, refFail===0?'pass':'fail');

log('\n=== INVALID INPUT TESTS ===', 'head');
// These should produce errors, not NaN
function testValidation(name, opts){
  const dfN = Number(opts.df), tN = Number(opts.t), aN = Number(opts.alpha);
  let errs=[];
  if(opts.df==null||opts.df===''||isNaN(dfN))errs.push('df invalid');
  else if(dfN<=0)errs.push('df<=0');
  if(opts.t!=null&&isNaN(Number(opts.t)))errs.push('t not numeric');
  if(opts.alpha!=null){if(isNaN(aN))errs.push('alpha NaN');else if(aN<=0||aN>=1)errs.push('alpha out of range');}
  const pass = errs.length > 0;
  log(`${pass?'PASS':'FAIL'} ${name}: caught [${errs.join(', ')}]`, pass?'pass':'fail');
}
testValidation('df=0', {df:0, alpha:0.05});
testValidation('df=-1', {df:-1, alpha:0.05});
testValidation('df empty', {df:'', alpha:0.05});
testValidation('df=abc', {df:'abc', alpha:0.05});
testValidation('alpha=0', {df:10, alpha:0});
testValidation('alpha=1', {df:10, alpha:1});
testValidation('alpha=2', {df:10, alpha:2});
testValidation('t=xyz', {df:10, t:'xyz', alpha:0.05});
